<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chinor — onlayn bozor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&family=Onest:wght@400;500&display=swap">
<style>
:root{--bg:#F2F2EF;--sf:#fff;--ink:#1B1D1F;--mu:#6C7176;--ln:#DCDDD8;--ac:#1F4E8C;--on:#fff;--tl:90%;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131517;--sf:#1C1F22;--ink:#ECEDEA;--mu:#9AA0A5;--ln:#2C3034;--ac:#86AADD;--on:#0F151C;--tl:22%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131517;--sf:#1C1F22;--ink:#ECEDEA;--mu:#9AA0A5;--ln:#2C3034;--ac:#86AADD;--on:#0F151C;--tl:22%;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Onest,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
p{margin:0}
input,select,button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:grid;grid-template-columns:auto 1fr auto;gap:12px 28px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--ln)}
.logo{font:500 27px Newsreader,Georgia,serif;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
#q{width:100%;max-width:440px;background:transparent;border:0;border-bottom:1px solid var(--ln);padding:8px 0;border-radius:0}
#q::placeholder{color:var(--mu)}
.cb{background:none;border:0;cursor:pointer;padding:6px 0}
.cb b{font-weight:500;background:var(--ac);color:var(--on);border-radius:10px;padding:0 8px;margin-left:6px;font-size:13px}
@media(max-width:600px){header{grid-template-columns:1fr auto}#q{grid-column:1/-1;order:3;max-width:none}}
main{max-width:1120px;margin:0 auto;padding:32px 20px 56px}
h1{font:400 clamp(26px,4vw,38px)/1.15 Newsreader,Georgia,serif;margin:0 0 28px;max-width:18ch}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--ln);margin-bottom:26px}
#cats{display:flex;gap:22px;overflow-x:auto}
#cats button{background:none;border:0;padding:10px 0;color:var(--mu);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
#cats .on{color:var(--ink);border-color:var(--ac)}
select{background:transparent;border:0;color:var(--mu);cursor:pointer}
select option{color:#1B1D1F}
.mu{color:var(--mu)}
#cnt{margin:-10px 0 18px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:30px 18px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.tile{aspect-ratio:4/5;border-radius:3px;display:grid;place-items:center;background:hsl(var(--h) 16% var(--tl));font:400 76px Newsreader,Georgia,serif;color:hsl(var(--h) 30% 45% / .55)}
.nm{margin-top:10px;font-size:14px}
.mc{color:var(--mu);font-size:13px}
.pr{font:500 19px Newsreader,Georgia,serif;margin-top:2px}
.add{margin-top:8px;width:100%;background:none;border:1px solid var(--ln);border-radius:3px;padding:8px;cursor:pointer}
.add:hover{border-color:var(--ac);color:var(--ac)}
footer{border-top:1px solid var(--ln);padding:20px;text-align:center;color:var(--mu);font-size:13px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .2s;z-index:20}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--sf);z-index:21;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(100%);visibility:hidden;transition:transform .25s,visibility .25s}
.open #cart{transform:none;visibility:visible}
.open #ov{opacity:1;visibility:visible}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h2{font:400 24px Newsreader,Georgia,serif;margin:0}
#cx{background:none;border:0;color:var(--mu);cursor:pointer}
#cb2{flex:1;overflow-y:auto}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--ln)}
.qty button{width:28px;height:28px;background:none;border:1px solid var(--ln);border-radius:3px;cursor:pointer}
.qty{display:flex;align-items:center;gap:10px}
#cf{padding-top:14px;display:grid;gap:10px}
#cf[hidden]{display:none}
.tt{display:flex;justify-content:space-between;font-size:17px}
#cf input{background:transparent;border:0;border-bottom:1px solid var(--ln);padding:8px 0;border-radius:0}
#er{font-size:13px;min-height:1.4em}
#ok{background:var(--ac);color:var(--on);border:0;border-radius:3px;padding:12px;cursor:pointer;font-weight:500}
@media(prefers-reduced-motion:reduce){#cart,#ov{transition:none}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#">chinor</a>
  <input id="q" type="search" placeholder="Mahsulot qidirish" aria-label="Mahsulot qidirish">
  <button class="cb" id="cb" aria-label="Savatni ochish">Savat <b id="cn">0</b></button>
</header>
<main>
  <h1>Kundalik buyumlar, ortiqcha shovqinsiz.</h1>
  <div class="bar">
    <nav id="cats" aria-label="Kategoriyalar"></nav>
    <select id="so" aria-label="Saralash"><option value="d">Tavsiya</option><option value="a">Arzonroq</option><option value="z">Qimmatroq</option></select>
  </div>
  <p id="cnt" class="mu"></p>
  <section id="grid" class="grid"></section>
</main>
<footer>Chinor. Toshkent bo’ylab yetkazib berish.</footer>

<div id="ov"></div>
<aside id="cart" aria-label="Savat">
  <div class="ch"><h2>Savat</h2><button id="cx">Yopish</button></div>
  <div id="cb2"></div>
  <div id="cf" hidden>
    <div class="tt"><span>Jami</span><b id="tot"></b></div>
    <input id="nm" placeholder="Ismingiz" autocomplete="name">
    <input id="tel" type="tel" placeholder="Telefon: +998 90 123 45 67" autocomplete="tel">
    <p id="er" class="mu"></p>
    <button id="ok">Buyurtma berish</button>
  </div>
</aside>

<script>
const P=[
{id:1,n:'Simsiz quloqchin',c:'Elektronika',p:189000,h:215},
{id:2,n:'Smart soat',c:'Elektronika',p:459000,h:200},
{id:3,n:'Powerbank 10000 mAh',c:'Elektronika',p:139000,h:230},
{id:4,n:'Paxta futbolka',c:'Kiyim',p:79000,h:25},
{id:5,n:'Jinsi shim',c:'Kiyim',p:219000,h:210},
{id:6,n:'Sport krossovka',c:'Kiyim',p:349000,h:150},
{id:7,n:'Keramika choynak',c:'Uy-ro’zg’or',p:95000,h:185},
{id:8,n:'Sochiq to’plami',c:'Uy-ro’zg’or',p:120000,h:40},
{id:9,n:'Stol chirog’i',c:'Uy-ro’zg’or',p:165000,h:50},
{id:10,n:'Quruq mevalar, 1 kg',c:'Oziq-ovqat',p:98000,h:30},
{id:11,n:'Yashil choy, 100 g',c:'Oziq-ovqat',p:35000,h:120},
{id:12,n:'Yog’och konstruktor',c:'Bolalar',p:129000,h:35}];
const C=['Hammasi','Elektronika','Kiyim','Uy-ro’zg’or','Oziq-ovqat','Bolalar'];
const $=s=>document.querySelector(s);
const f=n=>n.toLocaleString('ru-RU')+' so’m';
let cat=C[0],q='',so='d',cart={};
try{cart=JSON.parse(localStorage.getItem('chinor')||'{}')||{}}catch(e){cart={}}
const save=()=>{try{localStorage.setItem('chinor',JSON.stringify(cart))}catch(e){}};

function drawCats(){$('#cats').innerHTML=C.map(c=>`<button class="${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('')}
function draw(){
  const L=P.filter(p=>(cat===C[0]||p.c===cat)&&p.n.toLowerCase().includes(q));
  if(so==='a')L.sort((a,b)=>a.p-b.p);
  if(so==='z')L.sort((a,b)=>b.p-a.p);
  $('#cnt').textContent=L.length+' ta mahsulot';
  $('#grid').innerHTML=L.length?L.map(p=>`<article><div class="tile" style="--h:${p.h}" aria-hidden="true">${p.n[0]}</div><p class="nm">${p.n}</p><p class="mc">${p.c}</p><p class="pr">${f(p.p)}</p><button class="add" data-add="${p.id}">Savatga</button></article>`).join(''):'<p class="mu" style="grid-column:1/-1">Hech narsa topilmadi. Boshqa so’z bilan urinib ko’ring.</p>';
}
function drawCart(){
  const ids=Object.keys(cart).filter(i=>cart[i]>0&&P.some(p=>p.id==i));
  const n=ids.reduce((s,i)=>s+cart[i],0);
  const t=ids.reduce((s,i)=>s+cart[i]*P.find(p=>p.id==i).p,0);
  $('#cn').textContent=n;
  $('#tot').textContent=f(t);
  $('#cf').hidden=!ids.length;
  $('#cb2').innerHTML=ids.length?ids.map(i=>{const p=P.find(x=>x.id==i);return `<div class="row"><span>${p.n}</span><b>${f(p.p*cart[i])}</b><span class="qty"><button data-d="${i}" aria-label="Kamaytirish">−</button>${cart[i]}<button data-u="${i}" aria-label="Ko’paytirish">+</button></span></div>`}).join(''):'<p class="mu">Savat bo’sh. Mahsulot qo’shing.</p>';
  save();
}
const open=v=>document.body.classList.toggle('open',v);

document.addEventListener('click',e=>{
  if(e.target.id==='ov')return open(false);
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.c){cat=d.c;drawCats();draw()}
  else if(d.add){cart[d.add]=(cart[d.add]||0)+1;drawCart()}
  else if(d.u){cart[d.u]++;drawCart()}
  else if(d.d){cart[d.d]--;drawCart()}
  else if(t.id==='cb')open(true);
  else if(t.id==='cx')open(false);
  else if(t.id==='ok'){
    const nm=$('#nm').value.trim(),tel=$('#tel').value.replace(/\D/g,'');
    if(!nm||tel.length<9){$('#er').textContent='Ism va telefon raqamini to’g’ri kiriting.';return}
    const no=Math.floor(10000+Math.random()*90000);
    cart={};drawCart();$('#er').textContent='';
    const m=document.createElement('p');
    m.textContent='Buyurtma №'+no+' qabul qilindi. '+nm+', operator siz bilan tez orada bog’lanadi.';
    $('#cb2').replaceChildren(m);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')open(false)});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw()});
$('#so').addEventListener('change',e=>{so=e.target.value;draw()});
drawCats();draw();drawCart();
</script>
</body>
</html>
